name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Khởi tạo package và thư mục web www
      - run: npm init -y
      - run: mkdir -p www
      - run: cp index.html style.css www/ 2>/dev/null || true

      # 2. Cài đặt Capacitor & AdMob Plugin
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob esbuild

      # 3. Đóng gói file JS
      - run: npx esbuild main.js --bundle --outfile=www/main.js 2>/dev/null || cp main.js www/ 2>/dev/null || true

      # 4. Khởi tạo dự án Capacitor
      - run: npx cap init "App Ráp Câu" "com.trithucso.hoctienganhrapcau_0002_x9z" --web-dir www
      - run: npx cap add android

      # 5. Cấu hình bỏ qua lỗi SSL & Chèn AdMob Application ID
      - run: |
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
          if 'APPLICATION_ID' not in content:
              content = content.replace('</application>', f'    {admob_meta}\n    </application>')
          content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          "

      # 6. Sửa lỗi trùng lặp thư viện Kotlin
      - run: |
          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          " >> android/app/build.gradle

      # 7. Đồng bộ Capacitor và biên dịch APK
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # 8. Upload file APK kết quả
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
