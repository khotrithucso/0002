name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Chuẩn bị tài nguyên Web & Ép cấu hình capacitor.config.json
      - name: Prepare Web Assets
        run: |
          npm init -y
          mkdir -p www
          cp index.html www/index.html 2>/dev/null || true
          if [ -f style.css ]; then cp style.css www/ 2>/dev/null || true; fi

          echo '{
            "appId": "com.trithucso.hoctienganhrapcau_0002_x9z",
            "appName": "Tiếng Anh Ráp Câu Fast Pro V2",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      # 2. Cài đặt Capacitor & Plugins
      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      # 3. Khởi tạo & Đồng bộ Capacitor sang thư mục Android Assets
      - name: Sync Capacitor Android
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 4. Bỏ qua SSL & Cấu hình AdMob App ID
      - name: Configure Android Manifest
        run: |
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
              if 'APPLICATION_ID' not in content:
                  content = content.replace('</application>', f'    {admob_meta}\n    </application>')
              if 'networkSecurityConfig' not in content:
                  content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      # 5. Sửa trùng lặp thư viện Kotlin
      - name: Fix Gradle Dependencies
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "
            configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            " >> android/app/build.gradle
          fi

      # 6. Biên dịch APK Debug
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
